# Configuración del sitio en Netlify.
# El SSR se despliega como funciones serverless vía @astrojs/netlify; los
# archivos estáticos (con _redirects generado por el adaptador) van en dist.

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  # Astro 7 requiere Node >=22.12; se usa el LTS actual (igual que en local).
  NODE_VERSION = "24"
